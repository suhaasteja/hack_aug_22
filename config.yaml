# Pipeline configuration. Each module can be toggled independently;
# main.py only starts modules with enabled: true.
session:
  # Speed multiplier for synthetic replay (2.0 = twice as fast as scripted)
  replay_speed: 1.0

llm:
  model: gemini-3.7-flash

observability:
  enabled: true
  endpoint: http://localhost:4317   # SigNoz OTLP collector
  service_name: voc-factory
  environment: hackathon
  metric_interval_ms: 10000

modules:
  listen:
    enabled: true
    driver: synthetic          # synthetic | reachy (later) | mic (later)
    script: app/modules/listen/data/sales_meeting.jsonl
  web:
    enabled: true
    host: 127.0.0.1
    port: 7000
  extract:
    enabled: true
    window_size: 8             # segments of context per extraction
    stride: 4                  # run an extraction every N segments
  prd:
    enabled: true
    debounce_seconds: 2.5      # one revision per burst of ideas
  enrich:
    enabled: true
    max_queries: 4             # cap live searches per meeting
  factory:
    enabled: true
  loop:
    enabled: true
    # 0.0.0.0, not loopback: SigNoz runs in Docker and reaches the host via
    # host.docker.internal, which a 127.0.0.1 bind refuses.
    host: 0.0.0.0
    port: 7001               # SigNoz posts alerts here
    signoz_url: http://localhost:8080
    lookback_minutes: 15     # telemetry window pulled back for a brief
    max_invocations: 6       # Port agent quota is finite; cap the session
    cooldown_seconds: 120    # per role
    dry_run: false
    # role -> role invoked once the first finishes. A chain is skipped when
    # its target is not staffed, since the crew changes with the PRD.
    chain:
      backend-engineer: security-compliance-engineer
      integrations-engineer: backend-engineer
      data-ml-engineer: backend-engineer

# Fault injection for demonstrating the alert loop. 0.0 = off.
chaos:
  llm_fail_rate: 0.0
