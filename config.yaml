# Pipeline configuration. Each module can be toggled independently;
# main.py only starts modules with enabled: true.
session:
  # Speed multiplier for synthetic replay (2.0 = twice as fast as scripted)
  replay_speed: 1.0

llm:
  model: gemini-3.7-flash

modules:
  listen:
    enabled: true
    driver: synthetic          # synthetic | reachy (later) | mic (later)
    script: app/modules/listen/data/sales_meeting.jsonl
  web:
    enabled: true
    host: 127.0.0.1
    port: 7000
  extract:
    enabled: true
    window_size: 8             # segments of context per extraction
    stride: 4                  # run an extraction every N segments
  prd:
    enabled: true
    debounce_seconds: 2.5      # one revision per burst of ideas
  enrich:
    enabled: true
    max_queries: 4             # cap live searches per meeting
  factory:
    enabled: true
